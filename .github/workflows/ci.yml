name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow token can read the code and nothing else.
permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Coverage (scheduler engine and calendar feeds)
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop and phone)
        run: npm run test:e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
