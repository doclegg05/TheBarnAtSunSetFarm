      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Crossfade in over the dusk scene.
          tl.fromTo("#f08-all", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0);
          tl.fromTo("#f08-sky", { scale: 1.08 }, { scale: 1.0, duration: 7.5, ease: "sine.out" }, 0);

          // waterfall-entry: the name, phrase by phrase, under the spoken name.
          tl.fromTo("#f08-pre", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.4);
          tl.fromTo("#f08-name", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 2.7);

          tl.fromTo("#f08-place", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.3);
          tl.fromTo("#f08-tag", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.8);
          tl.fromTo("#f08-facts", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.4);
          // spring-pop-entrance: the call to action.
          tl.fromTo("#f08-cta", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 4.9);
          tl.to("#f08-cta", { scale: 1.04, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.0);
