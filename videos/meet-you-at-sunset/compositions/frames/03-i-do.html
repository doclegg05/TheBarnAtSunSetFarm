quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-cn5i" id="f03-photo" src="../../assets/photos/s3-vows.webp" alt="A couple exchanging vows under a draped cedar arch"></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#f03-panel", { xPercent: 100 }, { xPercent: 0, duration: 0.9, ease: "expo.out" }, 0);
          tl.fromTo("#f03-photo", { scale: 1.18 }, { scale: 1.04, duration: 6.2, ease: "sine.out" }, 0);
          tl.fromTo("#f03-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);
          // "I do." lands on the spoken words.
          tl.fromTo("#f03-ido", { opacity: 0, y: 120, rotation: -6, scale: 0.8 }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, 1.0);
          tl.fromTo("#f03-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 1.7);
          tl.fromTo("#f03-line", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.0);
          tl.fromTo("#f03-q2", { y: 500, rotation: -18, opacity: 0 }, { y: 0, rotation: -5, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 2.6);
          tl.fromTo("#f03-q1", { y: 500, rotation: 20, opacity: 0 }, { y: 0, rotation: 6, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 2.95);
          // A happy bounce on the cheer.
          tl.to("#f03-ido", { scale: 1.08, duration: 0.2, ease: "power2.out" }, 4.1);
          tl.to("#f03-ido", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, 4.3);

          // particle-burst: a fixed pool of petals, each a pure ballistic function of time.
          const COLORS = ["#ead1dc", "#f6e3ea", "#fdf8f5", "#d4af37", "#e6a35a", "#c9a3b5"];
          let seed = 20261013;
          const rand = () => {
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            return seed / 4294967296;
          };
          const host = document.getElementById("f03-petals");
          const ORIGIN = [380, 470];
          const petals = Array.from({ length: 40 }, () => {
            const el = document.createElement("span");
            el.className = "f03-petal";
            el.style.background = COLORS[Math.floor(rand() * COLORS.length)];
            host.appendChild(el);
            const angle = (-150 + rand() * 120) * (Math.PI / 180);
            const speed = 900 + rand() * 900;
            return { el, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, spin: -540 + rand() * 1080, size: 0.7 + rand() * 0.9 };
          });
          const GRAVITY = 1500;
          const DRAG = 0.55;
          const burst = { t: 0 };
          const BURST_DUR = 2.0;
          const draw = () => {
            const t = burst.t * BURST_DUR;
            petals.forEach((p) => {
              const k = (1 - Math.exp(-DRAG * t * 3)) / (DRAG * 3);
              const x = ORIGIN[0] + p.vx * k;
              const y = ORIGIN[1] + p.vy * k + 0.5 * GRAVITY * t * t * 0.45;
              const fade = t < 0.05 ? 0 : t > 1.5 ? Math.max(0, 1 - (t - 1.5) / 0.5) : 1;
              gsap.set(p.el, { x, y, rotation: p.spin * t, scale: p.size, opacity: fade });
            });
          };
          tl.fromTo(burst, { t: 0 }, { t: 1, duration: BURST_DUR, ease: "none", onUpdate: draw }, 4.05);
          window.__timelines["f03"] = tl;
        })();
      </script>
