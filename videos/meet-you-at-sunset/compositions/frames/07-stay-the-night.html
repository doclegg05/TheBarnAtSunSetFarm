      <script>
        (function () {
          const root = document.getElementById("f07");
          const W = root.clientWidth || 1920;
          // Two swags of string lights hung from the corners to a centre post.
          const TOP = 70;
          const SAG = W > 1500 ? 150 : 120;
          const PER_SWAG = W > 1500 ? 12 : 8;
          const swagY = (u) => TOP + SAG * (1 - u * u);
          const bulbs = [];
          let d = "";
          [[-20, W / 2], [W / 2, W + 20]].forEach(([x0, x1]) => {
            const mid = (x0 + x1) / 2;
            const half = (x1 - x0) / 2;
            for (let s = 0; s <= 40; s += 1) {
              const x = x0 + ((x1 - x0) * s) / 40;
              d += `${s === 0 ? "M" : "L"} ${x.toFixed(1)} ${swagY((x - mid) / half).toFixed(1)} `;
            }
            for (let i = 1; i <= PER_SWAG; i += 1) {
              const x = x0 + ((x1 - x0) * i) / (PER_SWAG + 1);
              bulbs.push([x, swagY((x - mid) / half)]);
            }
          });
          document.getElementById("f07-wire-path").setAttribute("d", d);
          const host = document.getElementById("f07-lights");
          const halos = bulbs.map(([x, y]) => {
            const b = document.createElement("span");
            b.className = "f07-bulb";
            b.setAttribute("data-layout-allow-overflow", "");
            b.style.left = `${x.toFixed(1)}px`;
            b.style.top = `${y.toFixed(1)}px`;
            const h = document.createElement("span");
            h.className = "f07-halo";
            h.setAttribute("data-layout-allow-overflow", "");
            b.appendChild(h);
            host.appendChild(b);
            return { b, h };
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#f07-cam", { scale: 1.0 }, { scale: 1.1, duration: 8.4, ease: "sine.inOut" }, 0);
          // Click: the strands light up in a quick wave from both ends toward the centre.
          halos.forEach(({ b, h }, i) => {
            const fromEdge = i < halos.length / 2 ? i : halos.length - 1 - i;
            const at = 0.12 + fromEdge * 0.035;
            tl.fromTo(b, { backgroundColor: "#6b5a48" }, { backgroundColor: "#fff1cf", duration: 0.08, ease: "none" }, at);
            tl.fromTo(h, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, at);
          });
          // One bulb is a little dramatic about it.
          const diva = halos[Math.floor(halos.length * 0.3)].h;
          tl.to(diva, { opacity: 0.2, duration: 0.06, ease: "none", yoyo: true, repeat: 3 }, 0.9);
          tl.fromTo("#f07-night", { opacity: 1 }, { opacity: 0.75, duration: 0.6, ease: "power2.out" }, 0.2);
          // "Stay the night." lands on the spoken words.
          tl.fromTo("#f07-head", { opacity: 0, y: 70, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.5)" }, 4.6);
          tl.fromTo("#f07-facts", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.2);
          // spring-pop-entrance: the lodging postcards rise, staggered.
          ["#f07-k1", "#f07-k2", "#f07-k3"].forEach((sel, i) => {
            const rot = [-4, 3, -2][i];
            tl.fromTo(sel, { y: 520, rotation: rot * 5, opacity: 0 }, { y: 0, rotation: rot, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 5.0 + i * 0.18);
          });
          tl.to("#f07-copy, #f07-cards", { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.9);
          window.__timelines["f07"] = tl;
        })();
      </script>
