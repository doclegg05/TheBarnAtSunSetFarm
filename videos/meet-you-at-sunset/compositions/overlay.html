<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../assets/brand.css" />
      <style>
        #overlay {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          container-type: size;
        }
        #ov-clock {
          position: absolute;
          left: 72px;
          top: 60px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 14px 30px 14px 22px;
          background: rgba(253, 248, 245, 0.94);
          border-radius: 999px;
          box-shadow: 0 10px 30px rgba(43, 43, 45, 0.25);
        }
        #ov-clock-sun {
          display: block;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: #fddb9a;
          box-shadow: 0 0 0 5px rgba(230, 163, 90, 0.25);
        }
        #ov-window {
          position: relative;
          display: block;
          width: 236px;
          height: 64px;
          overflow: hidden;
        }
        .ov-time {
          position: absolute;
          left: 0;
          top: 0;
          display: flex;
          align-items: baseline;
          gap: 10px;
          height: 64px;
          color: var(--ink);
          white-space: nowrap;
        }
        .ov-time b {
          font-family: var(--serif);
          font-weight: 700;
          font-size: 60px;
          line-height: 64px;
        }
        .ov-time i {
          font-family: var(--sans);
          font-style: normal;
          font-weight: 700;
          font-size: 24px;
          letter-spacing: 0.16em;
        }
        #ov-path {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        #ov-arm {
          position: absolute;
          left: 960px;
          top: 2160px;
          width: 1px;
          height: 1px;
          transform-origin: 0 0;
        }
        #ov-disc {
          position: absolute;
          left: -30px;
          top: -2100px; /* disc centre sits 2070px above the pivot */
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: radial-gradient(circle at 40% 38%, #fff3d6 0%, #fddb9a 45%, #e6a35a 100%);
          box-shadow: 0 0 40px 14px rgba(253, 219, 154, 0.55), 0 0 110px 40px rgba(230, 163, 90, 0.28);
        }
        @container (max-aspect-ratio: 1/1) {
          #ov-clock { left: 56px; top: 150px; }
          #ov-path { width: 1080px; height: 1920px; }
          #ov-arm { left: 540px; top: 2340px; }
          #ov-disc { top: -2120px; }
        }
      </style>

      <div id="overlay" data-composition-id="overlay">
        <svg id="ov-path" aria-hidden="true" data-layout-allow-overflow>
          <path id="ov-track" fill="none" stroke="rgba(253,248,245,0.6)" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" />
        </svg>
        <div id="ov-arm" data-layout-allow-overflow><div id="ov-disc" data-layout-allow-overflow></div></div>
        <div id="ov-clock">
          <span id="ov-clock-sun"></span>
          <span id="ov-window" data-layout-allow-overflow data-layout-allow-overlap>
            <span class="ov-time" id="ov-t1"><b>3:00</b><i>PM</i></span>
            <span class="ov-time" id="ov-t2"><b>3:45</b><i>PM</i></span>
            <span class="ov-time" id="ov-t3"><b>4:30</b><i>PM</i></span>
            <span class="ov-time" id="ov-t4"><b>5:30</b><i>PM</i></span>
            <span class="ov-time" id="ov-t5"><b>6:30</b><i>PM</i></span>
            <span class="ov-time" id="ov-t6"><b>7:45</b><i>PM</i></span>
            <span class="ov-time" id="ov-t7"><b>8:30</b><i>PM</i></span>
          </span>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("overlay");
          const portrait = root.clientHeight > root.clientWidth;
          // Arc geometry: a pivot far below the frame; the disc rides a circle of radius R.
          const W = portrait ? 1080 : 1920;
          const PIVOT_Y = portrait ? 2340 : 2160;
          const R = portrait ? 2090 : 2070;
          const DEG = [-6, 33];
          const pt = (deg) => {
            const r = (deg * Math.PI) / 180;
            return [W / 2 + R * Math.sin(r), PIVOT_Y - R * Math.cos(r)];
          };
          const [x0, y0] = pt(DEG[0]);
          const [x1, y1] = pt(DEG[1]);
          document.getElementById("ov-track").setAttribute("d", `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`);

          const tl = gsap.timeline({ paused: true });
          // Scene changes (seconds) and the clock reading for each scene.
          const FLIPS = [0, 7.0, 11.8, 18.0, 20.6, 25.6, 31.6];
          const times = ["#ov-t1", "#ov-t2", "#ov-t3", "#ov-t4", "#ov-t5", "#ov-t6", "#ov-t7"];

          tl.fromTo("#ov-clock", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.15);
          tl.set(times[0], { yPercent: 0, opacity: 1 }, 0);
          times.slice(1).forEach((sel, k) => {
            const i = k + 1;
            const at = FLIPS[i] - 0.05;
            tl.set(sel, { yPercent: 100, opacity: 0 }, 0);
            tl.to(times[i - 1], { yPercent: -100, opacity: 0, duration: 0.35, ease: "power2.in" }, at);
            tl.to(sel, { yPercent: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, at + 0.18);
            tl.to("#ov-clock", { scale: 1.07, duration: 0.18, ease: "power2.out" }, at + 0.1);
            tl.to("#ov-clock", { scale: 1, duration: 0.3, ease: "power2.inOut" }, at + 0.28);
          });

          // Sun angle per scene: high at 3 PM, low on the right at golden hour, set by 8:30.
          const SUN = [[0, -6], [7.0, 0], [11.8, 5], [18.0, 11], [20.6, 14], [25.6, 19], [31.6, 26], [34.5, 33]];
          tl.set("#ov-arm", { rotation: SUN[0][1] }, 0);
          SUN.slice(1).forEach(([t, deg], i) => {
            const t0 = SUN[i][0];
            tl.to("#ov-arm", { rotation: deg, duration: t - t0, ease: "none" }, t0);
          });
          tl.fromTo("#ov-path, #ov-arm", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.4);
          // The clock's little sun warms from gold to cedar as evening comes.
          tl.to("#ov-clock-sun", { backgroundColor: "#b8692f", duration: 38, ease: "none" }, 0);
          tl.to("#ov-path", { opacity: 0, duration: 1.2, ease: "power1.in" }, 33.5);
          tl.to("#ov-clock", { opacity: 0, x: -30, duration: 0.5, ease: "power2.in" }, 39.4);

          window.__timelines["overlay"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
